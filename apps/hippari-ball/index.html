<!doctype html>
<html lang="ja">
<head>
  <!-- 文字化けしないように、文字の種類（UTF-8）を決めています -->
  <meta charset="utf-8">
  <!-- スマホで画面の幅に合わせて表示するための設定です -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひっぱりボール</title>
  <style>
    /* ページ全体の見た目。背景を暗くして、ゲームの場所を真ん中に置きます */
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 16px;           /* 周りに余白を入れます（スマホでも16px） */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e2e;
      color: #f0f0f0;
      font-family: sans-serif;
    }

    /* ゲームの場所（canvas）の枠。中身の大きさは game.js と同じ 480x800 です */
    canvas {
      box-sizing: border-box;  /* 枠線も含めて大きさを計算します（はみ出し防止） */
      background: #2b2d42;
      border: 2px solid #8d99ae;
      /* 幅は「480px」「画面の幅」「窓の高さに合う幅」のうち一番小さい値にします。
         高さは縦横の比（480：800）から自動で決まるので、窓の中に全部入ります */
      width: min(480px, calc(100vw - 40px), calc((100vh - 40px) * 0.6));
      height: auto;
      aspect-ratio: 480 / 800;
    }
  </style>
</head>
<body>
  <!-- ゲームの場所。絵は game.js が描きます -->
  <canvas id="game" width="480" height="800"></canvas>

  <!-- game.js を読み込みます。HTMLの最後に置くと、canvasが準備できてから動きます -->
  <script src="game.js"></script>
</body>
</html>
