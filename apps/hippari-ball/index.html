<!doctype html>
<html lang="ja">
<head>
  <!-- 文字化けしないように、文字の種類（UTF-8）を決めています -->
  <meta charset="utf-8">
  <!-- スマホで画面の幅に合わせて表示するための設定です -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひっぱりボール</title>
  <style>
    /* ページ全体の見た目。背景を暗くして、ゲームの場所を真ん中に置きます */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e2e;
      color: #f0f0f0;
      font-family: sans-serif;
    }

    /* ゲームの場所（canvas）の枠。大きさは game.js と同じ 480x800 です */
    canvas {
      background: #2b2d42;
      border: 2px solid #8d99ae;
      max-width: 100%;   /* 小さい画面では、はみ出さないように縮めます */
      height: auto;
    }
  </style>
</head>
<body>
  <!-- ゲームの場所。絵は game.js が描きます -->
  <canvas id="game" width="480" height="800"></canvas>

  <!-- game.js を読み込みます。HTMLの最後に置くと、canvasが準備できてから動きます -->
  <script src="game.js"></script>
</body>
</html>
